name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Lint · Typecheck · Test · Build (${{ matrix.os }})
    # Run the full gate on Windows as well as macOS: the app ships a Windows
    # installer, and platform-specific breakage (path handling, capture
    # backends, helper-binary resolution) is invisible in a macOS-only job.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build (renderer + electron)
        run: npm run build
