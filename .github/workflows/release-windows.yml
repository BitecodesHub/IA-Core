name: Windows Installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build NSIS installer + portable
    runs-on: windows-latest
    permissions:
      contents: write # create the GitHub Release on tag builds
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + main process
        run: npm run build

      # Manual runs: build only, artifacts downloadable from the run page.
      - name: Package (no publish)
        if: github.ref_type != 'tag'
        run: npx electron-builder --config electron-builder.config.cjs --win --x64 --arm64 --publish never

      # Tag builds (v*): package and attach the installer to a GitHub Release.
      - name: Package and publish release
        if: github.ref_type == 'tag'
        run: npx electron-builder --config electron-builder.config.cjs --win --x64 --arm64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Native modules must be the Windows build: fail loudly if sharp's
      # win32 binary did not make it into the package (it silently falls back
      # to a slower resizer otherwise).
      - name: Verify native image library is packaged
        shell: pwsh
        run: |
          $hit = Get-ChildItem -Recurse "release\win-unpacked\resources\app.asar.unpacked\node_modules\@img" -Filter "sharp-win32-x64.node" -ErrorAction SilentlyContinue
          if (-not $hit) { throw "sharp-win32-x64.node missing from the package" }
          "found: $($hit.FullName)"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
