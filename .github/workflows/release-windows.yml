name: Windows Installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build NSIS installer + portable
    runs-on: windows-latest
    permissions:
      contents: write # create the GitHub Release on tag builds
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + main process
        run: npm run build

      # Manual runs: build only, artifacts downloadable from the run page.
      - name: Package (no publish)
        if: github.ref_type != 'tag'
        run: npx electron-builder --win --publish never

      # Tag builds (v*): package and attach the installer to a GitHub Release.
      - name: Package and publish release
        if: github.ref_type == 'tag'
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
